<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WonderWatch | Watch Anime</title>
  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            heading: ['"Outfit"', 'sans-serif'],
          },
          colors: {
            brand: {
              300: '#bef264',
              400: '#a3e635',
              500: '#84cc16',
              600: '#65a30d',
            },
            surface: {
              750: '#20222a',
              800: '#171821',
              850: '#111218',
              900: '#0b0c10',
              950: '#050608',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    h1, h2, h3, h4, .font-heading {
      font-family: 'Outfit', sans-serif;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #050608;
    }
    ::-webkit-scrollbar-thumb {
      background: #1f212a;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #84cc16;
    }
  </style>
</head>
<body class="bg-surface-950 text-zinc-100 min-h-screen flex flex-col font-sans selection:bg-brand-500 selection:text-black">

  <!-- Header / Navigation -->
  <header class="border-b border-zinc-900/90 bg-surface-950/90 backdrop-blur-2xl sticky top-0 z-50 px-4 sm:px-8 py-3.5 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-2.5 group">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-brand-500 to-brand-300 flex items-center justify-center text-black font-black text-sm shadow-lg shadow-brand-500/25 group-hover:scale-105 transition">
        <i class="fa-solid fa-play text-xs ml-0.5"></i>
      </div>
      <span class="text-xl font-heading font-black tracking-wider text-white">WONDER<span class="text-brand-400">WATCH</span></span>
    </a>
    <a href="index.html" class="text-xs bg-surface-900 border border-zinc-800 hover:border-brand-500/50 px-4 py-2 rounded-xl text-zinc-300 hover:text-white transition flex items-center gap-2 font-medium">
      <i class="fa-solid fa-arrow-left"></i> Back to Browse
    </a>
  </header>

  <!-- Main Watch Layout -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">
    
    <!-- Video Player + Stream Controls Row -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Left 2 Cols: Embed Player -->
      <div class="lg:col-span-2 flex flex-col gap-4">
        
        <!-- Player Viewport with Discrete Play Shield -->
        <div class="relative w-full aspect-video bg-black rounded-3xl overflow-hidden border border-zinc-800 shadow-2xl group">
          <iframe 
            id="playerFrame" 
            src="" 
            class="w-full h-full border-0" 
            allow="fullscreen; autoplay; encrypted-media; picture-in-picture"
            allowfullscreen 
            scrolling="no">
          </iframe>

          <!-- Discrete Play Button Shield -->
          <div 
            id="adShield" 
            onclick="dismissAdShield(event)" 
            class="absolute inset-0 bg-black/40 backdrop-blur-[2px] cursor-pointer z-30 flex flex-col items-center justify-center transition duration-300 select-none"
            title="Click to Play"
          >
            <!-- Native-looking HiAnime/YouTube style Play Icon -->
            <div id="shieldPlayIcon" class="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-brand-500 text-black flex items-center justify-center shadow-2xl shadow-brand-500/50 group-hover:scale-110 transition duration-300">
              <i class="fa-solid fa-play text-xl sm:text-2xl ml-1"></i>
            </div>
            <span id="shieldStatusText" class="mt-3 text-xs font-semibold tracking-wide text-zinc-300 bg-surface-900/80 px-3 py-1 rounded-full border border-zinc-700/60 shadow">
              Loading stream...
            </span>
          </div>
        </div>

        <!-- Info & Controls Bar -->
        <div class="bg-surface-900 border border-zinc-800/80 p-5 rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 shadow-xl">
          <div class="space-y-1">
            <h1 id="animeTitle" class="text-xl sm:text-2xl font-heading font-black tracking-tight text-white line-clamp-1">Loading Title...</h1>
            <div class="flex items-center gap-2 text-xs text-zinc-400">
              <span id="animeSubInfo" class="text-brand-400 font-bold">Episode 1 • SUB</span>
              <span>•</span>
              <span id="activeSourceBadge" class="bg-surface-800 px-2 py-0.5 rounded text-[11px] text-zinc-300 font-medium">Server 1 (Primary)</span>
            </div>
          </div>
          
          <!-- Stream Controls -->
          <div class="flex flex-wrap items-center gap-2.5 w-full sm:w-auto">
            <!-- Server Selector (Server 1 is the 100% stable MAL route) -->
            <select id="sourceSelect" onchange="changeSource()" class="bg-surface-800 border border-zinc-700/80 text-xs font-semibold px-3 py-2 rounded-xl text-zinc-200 focus:outline-none focus:border-brand-500">
              <option value="zoko_mal">Server 1 (Primary)</option>
              <option value="vidlink">Server 2 (Backup)</option>
            </select>

            <!-- Sub / Dub Selector -->
            <select id="streamTypeSelect" onchange="changeStreamType()" class="bg-surface-800 border border-zinc-700/80 text-xs font-semibold px-3 py-2 rounded-xl text-zinc-200 focus:outline-none focus:border-brand-500">
              <option value="sub">Subtitled</option>
              <option value="dub">Dubbed</option>
            </select>

            <!-- Next Episode Button -->
            <button onclick="handleNextEpisode()" class="bg-brand-500 hover:bg-brand-400 text-black font-heading font-bold px-4 py-2 rounded-xl text-xs transition shadow-lg shadow-brand-500/20 flex items-center gap-1.5">
              Next <i class="fa-solid fa-forward-step text-[10px]"></i>
            </button>
          </div>
        </div>

        <!-- Series Synopsis & Metadata -->
        <div class="bg-surface-900 border border-zinc-800/80 p-5 rounded-2xl space-y-3">
          <div class="flex items-center justify-between">
            <h3 class="text-sm font-heading font-bold uppercase tracking-wider text-zinc-300 flex items-center gap-2">
              <i class="fa-solid fa-circle-info text-brand-400"></i> Synopsis
            </h3>
            <div id="genresList" class="flex flex-wrap gap-1.5"></div>
          </div>
          <p id="animeDescription" class="text-xs sm:text-sm text-zinc-400 leading-relaxed font-normal">Loading anime description...</p>
        </div>
      </div>

      <!-- Right 1 Col: Episodes & Series Grouping -->
      <div class="flex flex-col gap-4">
        
        <!-- Episode Selector Box -->
        <div class="bg-surface-900 border border-zinc-800/80 rounded-2xl p-5 flex flex-col h-[480px] shadow-xl">
          <div class="flex justify-between items-center mb-3 pb-2 border-b border-zinc-800">
            <h2 class="font-heading font-bold text-xs tracking-wider text-zinc-300 uppercase flex items-center gap-2">
              <i class="fa-solid fa-list-ol text-brand-400"></i> Episode List
            </h2>
            <span id="totalEpCount" class="text-xs font-semibold text-zinc-400">Total: 12</span>
          </div>

          <!-- Quick Episode Range Filter for 50+ Ep anime -->
          <div id="epRangeFilter" class="hidden mb-3 flex items-center gap-2 overflow-x-auto pb-1 text-[11px]"></div>
          
          <!-- Episode Numbers Grid -->
          <div id="episodeGrid" class="flex-1 overflow-y-auto pr-1 grid grid-cols-5 sm:grid-cols-6 lg:grid-cols-5 gap-2 content-start">
            <!-- Episode Buttons rendered here -->
          </div>
        </div>

        <!-- Series Franchise Seasons & Related Parts -->
        <div id="seriesGroupSection" class="bg-surface-900 border border-zinc-800/80 rounded-2xl p-5 space-y-3 shadow-xl">
          <div class="flex justify-between items-center pb-2 border-b border-zinc-800">
            <h2 class="font-heading font-bold text-xs tracking-wider text-zinc-300 uppercase flex items-center gap-2">
              <i class="fa-solid fa-layer-group text-brand-400"></i> Series & Seasons
            </h2>
            <span class="text-[10px] text-zinc-500 uppercase tracking-widest font-bold">Franchise</span>
          </div>
          <div id="seriesGroupList" class="space-y-2 max-h-[300px] overflow-y-auto pr-1">
            <div class="py-4 text-center text-zinc-500 text-xs animate-pulse">Loading related seasons...</div>
          </div>
        </div>

      </div>

    </div>

  </main>

  <script>
    // --- POPUP & REDIRECT COUNTERMEASURES ---
    let allowInternalNavigation = false;
    let isIframeLoaded = false;

    // Detect internal clicks (links/buttons/episodes)
    document.addEventListener('click', (e) => {
      const target = e.target.closest('a, button, select');
      if (target) {
        allowInternalNavigation = true;
        setTimeout(() => { allowInternalNavigation = false; }, 2000);
      }
    });

    // 1. Trap top-level page hijacking attempts (window.top.location = ad)
    window.addEventListener('beforeunload', (e) => {
      if (!allowInternalNavigation) {
        e.preventDefault();
        e.returnValue = '';
        return '';
      }
    });

    // 2. Override window.open at the top-window context
    const originalOpen = window.open;
    window.open = function(url, target, features) {
      if (allowInternalNavigation) {
        return originalOpen.apply(this, arguments);
      }
      console.warn("Blocked unwanted window.open popup attempt:", url);
      return null;
    };

    // 3. Smart Discrete Play Shield with Readiness Check
    const playerFrame = document.getElementById('playerFrame');
    const adShield = document.getElementById('adShield');
    const shieldStatusText = document.getElementById('shieldStatusText');

    playerFrame.addEventListener('load', () => {
      isIframeLoaded = true;
      if (shieldStatusText) {
        shieldStatusText.innerText = "Click to Play";
        shieldStatusText.classList.add('text-brand-400');
      }
    });

    function dismissAdShield(event) {
      event.preventDefault();
      event.stopPropagation();
      
      // If the iframe hasn't finished loading its scripts, wait briefly so the ad trap doesn't survive
      if (!isIframeLoaded) {
        if (shieldStatusText) shieldStatusText.innerText = "Buffering stream... please wait";
        return;
      }

      if (adShield) {
        adShield.style.opacity = '0';
        setTimeout(() => {
          adShield.style.display = 'none';
        }, 200);
      }
    }

    function resetAdShield() {
      isIframeLoaded = false;
      if (adShield) {
        adShield.style.display = 'flex';
        adShield.style.opacity = '1';
        if (shieldStatusText) {
          shieldStatusText.innerText = "Loading stream...";
          shieldStatusText.classList.remove('text-brand-400');
        }
      }
    }

    // --- APPLICATION LOGIC ---
    const urlParams = new URLSearchParams(window.location.search);
    let animeId = urlParams.get('id') || '1';
    let malId = urlParams.get('malId') || animeId;
    let animeTitle = urlParams.get('title') || 'Anime Stream';
    let totalEpisodes = parseInt(urlParams.get('eps')) || 12;
    if (isNaN(totalEpisodes) || totalEpisodes <= 0) totalEpisodes = 12;
    
    let currentEpisode = 1;
    let currentType = 'sub';
    let currentServer = 'zoko_mal'; // Primary 100% reliable stream route

    const episodeGrid = document.getElementById('episodeGrid');

    document.getElementById('animeTitle').innerText = animeTitle;
    document.getElementById('totalEpCount').innerText = `Total: ${totalEpisodes}`;

    function renderEpisodes() {
      episodeGrid.innerHTML = '';
      for (let i = 1; i <= totalEpisodes; i++) {
        const btn = document.createElement('button');
        btn.innerText = i;
        btn.onclick = () => {
          allowInternalNavigation = true;
          currentEpisode = i;
          loadPlayer();
          renderEpisodes();
          resetAdShield();
          setTimeout(() => { allowInternalNavigation = false; }, 1000);
        };
        
        let baseClasses = "h-10 rounded-xl text-xs font-bold transition flex items-center justify-center border ";
        if (i === currentEpisode) {
          baseClasses += "bg-brand-500 text-black border-brand-400 shadow-md shadow-brand-500/25";
        } else {
          baseClasses += "bg-surface-800 text-zinc-300 border-zinc-700/60 hover:bg-surface-750 hover:border-zinc-500";
        }
        btn.className = baseClasses;
        episodeGrid.appendChild(btn);
      }
    }

    function loadPlayer() {
      document.getElementById('animeSubInfo').innerText = `Episode ${currentEpisode} • ${currentType.toUpperCase()}`;
      
      if (currentServer === 'zoko_mal') {
        document.getElementById('activeSourceBadge').innerText = 'Server 1 (Primary)';
        // 100% reliable MAL stream route with lime accent & autoplay
        playerFrame.src = `https://zokoanime.video/stream/mal/${malId}/${currentEpisode}/${currentType}?color=84cc16&autoplay=1`;
      } else if (currentServer === 'vidlink') {
        document.getElementById('activeSourceBadge').innerText = 'Server 2 (Backup)';
        playerFrame.src = `https://vidlink.pro/anime/${malId}/${currentEpisode}/${currentType}?primaryColor=84cc16&icons=vid&autoplay=true&fallback=true`;
      }
    }

    function changeSource() {
      allowInternalNavigation = true;
      currentServer = document.getElementById('sourceSelect').value;
      loadPlayer();
      resetAdShield();
      setTimeout(() => { allowInternalNavigation = false; }, 1000);
    }

    function changeStreamType() {
      allowInternalNavigation = true;
      currentType = document.getElementById('streamTypeSelect').value;
      loadPlayer();
      resetAdShield();
      setTimeout(() => { allowInternalNavigation = false; }, 1000);
    }

    function handleNextEpisode() {
      if (currentEpisode < totalEpisodes) {
        allowInternalNavigation = true;
        currentEpisode++;
        loadPlayer();
        renderEpisodes();
        resetAdShield();
        setTimeout(() => { allowInternalNavigation = false; }, 1000);
      }
    }

    // Fetch Full Anime Info & Related Seasons (Franchise Grouping)
    async function loadSeriesData() {
      const query = `
        query ($id: Int) {
          Media(id: $id, type: ANIME) {
            id
            idMal
            title { romaji english }
            description(asHtml: false)
            episodes
            genres
            averageScore
            relations {
              edges {
                relationType
                node {
                  id
                  idMal
                  title { romaji english }
                  format
                  episodes
                  type
                  coverImage { medium }
                  averageScore
                  startDate { year }
                }
              }
            }
          }
        }
      `;

      try {
        const res = await fetch('https://graphql.anilist.co', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ query, variables: { id: parseInt(animeId) } })
        });
        const json = await res.json();
        const media = json.data?.Media;

        if (media) {
          if (media.episodes && media.episodes > 0) {
            totalEpisodes = media.episodes;
            document.getElementById('totalEpCount').innerText = `Total: ${totalEpisodes}`;
            renderEpisodes();
          }

          if (media.idMal) {
            malId = media.idMal;
            loadPlayer();
          }

          const descEl = document.getElementById('animeDescription');
          descEl.innerText = media.description || 'No description available for this anime.';
          
          const genresContainer = document.getElementById('genresList');
          genresContainer.innerHTML = '';
          media.genres?.slice(0, 4).forEach(genre => {
            const span = document.createElement('span');
            span.className = 'text-[10px] bg-surface-800 border border-zinc-700/60 px-2.5 py-0.5 rounded-md text-zinc-300 font-semibold';
            span.innerText = genre;
            genresContainer.appendChild(span);
          });

          renderSeriesRelations(media.relations?.edges, media);
        }
      } catch (err) {
        console.error('Failed to load series franchise data:', err);
      }
    }

    function renderSeriesRelations(edges, currentMedia) {
      const container = document.getElementById('seriesGroupList');
      container.innerHTML = '';

      const validRelations = edges ? edges.filter(edge => edge.node && edge.node.type === 'ANIME') : [];

      if (validRelations.length === 0) {
        container.innerHTML = `<div class="py-4 text-center text-zinc-500 text-xs">Standalone anime (No other seasons or spinoffs).</div>`;
        return;
      }

      // Add Current Season Card First
      const currentTitle = currentMedia.title.english || currentMedia.title.romaji;
      const currentCard = document.createElement('div');
      currentCard.className = 'flex items-center gap-3 p-2.5 rounded-xl bg-brand-500/10 border border-brand-500/40 text-left';
      currentCard.innerHTML = `
        <div class="w-8 h-10 rounded-lg bg-brand-500 flex items-center justify-center text-black font-black text-xs flex-shrink-0">
          <i class="fa-solid fa-circle-play"></i>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-1.5">
            <span class="text-[9px] font-black uppercase tracking-wider text-brand-400 bg-brand-500/20 px-1.5 py-0.5 rounded">NOW PLAYING</span>
            <span class="text-[10px] text-zinc-400 font-medium">${currentMedia.episodes || '?'} eps</span>
          </div>
          <h4 class="text-xs font-heading font-bold text-white truncate mt-0.5">${currentTitle}</h4>
        </div>
      `;
      container.appendChild(currentCard);

      // Render Related Seasons / Sequels / Prequels / Side Stories
      validRelations.forEach(edge => {
        const node = edge.node;
        const relType = edge.relationType.replace(/_/g, ' ');
        const relTitle = node.title.english || node.title.romaji || 'Related Title';
        const relImg = node.coverImage?.medium || '';
        const relYear = node.startDate?.year || '';

        const card = document.createElement('div');
        card.className = 'flex items-center gap-3 p-2.5 rounded-xl bg-surface-800 border border-zinc-700/50 hover:border-brand-500/50 hover:bg-surface-750 cursor-pointer transition text-left group';
        card.innerHTML = `
          <img src="${relImg}" class="w-8 h-11 object-cover rounded-lg bg-surface-950 flex-shrink-0 group-hover:scale-105 transition">
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-1.5">
              <span class="text-[9px] font-bold uppercase tracking-wider text-brand-400 bg-brand-500/15 border border-brand-500/25 px-1.5 py-0.5 rounded">${relType}</span>
              <span class="text-[10px] text-zinc-400 font-medium">${node.format || 'TV'} • ${node.episodes || '?'} eps</span>
              ${relYear ? `<span class="text-[10px] text-zinc-500">• ${relYear}</span>` : ''}
            </div>
            <h4 class="text-xs font-heading font-bold text-zinc-200 group-hover:text-brand-400 truncate mt-0.5 transition">${relTitle}</h4>
          </div>
          <i class="fa-solid fa-play text-zinc-600 group-hover:text-brand-400 text-xs pr-1 transition"></i>
        `;

        card.onclick = () => {
          allowInternalNavigation = true;
          window.location.href = `watch.html?id=${node.id}&malId=${node.idMal || node.id}&title=${encodeURIComponent(relTitle)}&eps=${node.episodes || 12}`;
        };
        container.appendChild(card);
      });
    }

    renderEpisodes();
    loadPlayer();
    loadSeriesData();
  </script>
</body>
</html>
